name: Deploy to AWS EC2

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew bootJar -x test

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY: ${{ secrets.EC2_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts 2>/dev/null
          
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $EC2_USER@$EC2_HOST << 'EOF'
          mkdir -p /app
          pkill -f java || true
          sleep 2
          EOF
          
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa build/libs/login-crud-0.0.1-SNAPSHOT.jar $EC2_USER@$EC2_HOST:/app/
          
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $EC2_USER@$EC2_HOST << 'EOF'
          cd /app
          java -jar login-crud-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
          echo "✅ 배포 완료!"
          EOF

      - name: Deployment Success
        run: echo "🎉 AWS EC2에 배포되었습니다!"