<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>프로젝트 면접 준비</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="/css/home.css">
    <link rel="stylesheet" type="text/css" href="/css/interview.css">
</head>
<body>

<div class="board-container">
    <div class="board-header">
        <h2>프로젝트 면접 준비</h2>
        <a th:href="@{/home}" class="interview-back-link">← 홈으로</a>
    </div>

    <p style="color:var(--text-muted);font-size:14px;margin:-8px 0 20px 0;">
        GitHub 저장소 URL만 등록하면, AI가 프로젝트 내용을 읽고 기술 면접 질문을 만들어 드려요.
        답변을 제출하면 바로 첨삭과 함께 다음 질문이 이어집니다.
    </p>

    <div th:if="${errorMessage}" class="interview-error">
        <span th:text="${errorMessage}">에러 메시지</span>
    </div>

    <form th:action="@{/interview/register}" method="post" class="interview-register-form">
        <input type="text" name="repoUrl" placeholder="https://github.com/owner/repo" required>
        <button type="submit" class="write-button">프로젝트 등록</button>
    </form>

    <div th:if="${projectList == null or #lists.isEmpty(projectList)}" class="empty-board">
        등록된 프로젝트가 없습니다. GitHub 저장소 URL을 등록해보세요.
    </div>

    <table th:if="${projectList != null and !#lists.isEmpty(projectList)}" class="board-table">
        <thead>
        <tr>
            <th>저장소</th>
            <th>주요 언어</th>
            <th>설명</th>
            <th>등록일</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="project : ${projectList}">
            <td class="title-cell">
                <a th:href="@{/interview/{id}(id=${project.id})}"
                   th:text="${project.repoOwner} + '/' + ${project.repoName}">owner/repo</a>
            </td>
            <td th:text="${project.primaryLanguage} ?: '-'">Java</td>
            <td th:text="${project.description} ?: '-'">설명 없음</td>
            <td th:text="${#temporals.format(project.createdAt, 'yyyy-MM-dd')}">2026-07-16</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
