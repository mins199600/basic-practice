<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>내 정보</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="/css/edit.css">
</head>
<body>

    <div id="myInfoContainer">

        <h2 id="myInfoTitle">내 정보</h2>

        <div id="messageBox" th:if="${message}" th:text="${message}"></div>

        <!-- 프로필 사진 카드 -->
        <div id="profileImageCard" class="infoCard">
            <div class="cardTitle">프로필 사진</div>
            <div class="cardContent">
                <div class="profileImageRow">
                    <img th:if="${user.profileImage != null and user.profileImage != ''}"
                         th:src="${user.profileImage}" alt="프로필 사진" class="profileImagePreview">
                    <span th:unless="${user.profileImage != null and user.profileImage != ''}"
                          class="profileImagePlaceholder">📷</span>

                    <form th:action="@{/user/profile-image}" method="post" enctype="multipart/form-data" class="profileImageForm">
                        <input type="file" name="profileImage" accept="image/jpeg,image/png,image/webp,image/gif" required>
                        <button type="submit">사진 업로드</button>
                    </form>
                </div>
                <p class="profileImageHint">jpg, png, webp, gif · 최대 5MB</p>
            </div>
        </div>

        <!-- 회원정보 수정 카드 -->
        <div id="editCard" class="infoCard">
            <div id="editTitle" class="cardTitle">회원정보 수정</div>

            <div id="editContent" class="cardContent">

                <form id="editForm" th:action="@{/user/edit}" method="post" th:object="${user}">

                    <div id="emailBox" class="inputBox">
                        <label id="emailLabel" class="inputLabel" for="emailInput">이메일</label>
                        <input id="emailInput" type="email" th:field="*{email}">
                    </div>

                    <div id="nicknameBox" class="inputBox">
                        <label id="nicknameLabel" class="inputLabel" for="nicknameInput">닉네임</label>
                        <input id="nicknameInput" type="text" th:field="*{nickName}" placeholder="닉네임을 입력하세요">
                    </div>

                    <div id="passwordBox" class="inputBox">
                        <label id="passwordLabel" class="inputLabel" for="passwordInput">새 비밀번호</label>
                        <input id="passwordInput" type="password" th:field="*{password}" placeholder="변경할 비밀번호 입력하세요">
                    </div>

                    <button id="editSubmitButton" type="submit">수정 완료</button>

                </form>

            </div>
        </div>

        <!-- 회원 탈퇴 카드 -->
        <div id="deleteCard" class="infoCard">

            <div id="deleteTitle" class="cardTitle">회원 탈퇴</div>

            <div id="deleteContent" class="cardContent">

                <p id="deleteDescription">
                    회원 탈퇴 시 계정 정보가 삭제됩니다.<br>
                    삭제된 정보는 복구할 수 없습니다.
                </p>

                <form th:action="@{/user/delete}" id="deleteForm" method="post"
                      onsubmit="return confirm('정말 회원탈퇴 하시겠습니까? 삭제 후 복구할 수 없습니다.');">
                    <button id="deleteButton" type="submit">회원 탈퇴</button>
                </form>

            </div>
        </div>

    </div>

</body>
</html>
