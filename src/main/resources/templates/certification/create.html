<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>자격증 추가</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="/css/create.css">
</head>
<body>

<div class="board-form-container">
    <div class="board-form-card">
        <h2 class="form-title">자격증 추가</h2>

        <form th:action="@{/certification/create}" method="post">
            <div class="form-group">
                <label for="certName">자격증명</label>
                <input type="text" id="certName" name="certName" class="form-control"
                       placeholder="예: 정보처리기사, SQLD" required>
            </div>

            <div class="form-group">
                <label for="examDate">시험 예정일</label>
                <input type="date" id="examDate" name="examDate" class="form-control">
            </div>

            <div class="form-group">
                <label for="status">상태</label>
                <select id="status" name="status" class="form-control">
                    <option value="준비중" selected>준비중</option>
                    <option value="합격">합격</option>
                    <option value="불합격">불합격</option>
                </select>
            </div>

            <div class="form-group">
                <label for="memo">메모</label>
                <textarea id="memo" name="memo" class="form-control" rows="4"
                          placeholder="취약 파트, 스터디 계획 등"></textarea>
            </div>

            <div class="form-button-area">
                <button type="submit" class="submit-button">등록</button>
                <a th:href="@{/certification}" class="cancel-button">취소</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
