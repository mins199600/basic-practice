<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>자격증 문제풀이</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="/css/create.css">
    <link rel="stylesheet" type="text/css" href="/css/quiz.css">
</head>
<body>

<div class="board-form-container">
    <div class="board-form-card">

        <div style="text-align:right;margin-bottom:8px;">
            <a th:href="@{/home}" class="interview-back-link">← 홈으로</a>
        </div>

        <!-- ============ 문제 출제 화면 ============ -->
        <div th:if="${mode == 'question'}">
            <p class="quiz-progress">
                <span th:text="${roundNumber} + '회차'">1회차</span>
                ·
                <span th:text="${progressCurrent} + ' / ' + ${progressTotal}">1 / 60</span>
                <span th:if="${roundNumber > 1}" class="quiz-progress-hint">(지난 회차 오답만 다시 풀어요)</span>
            </p>
            <h2 class="form-title" th:text="${question.questionText}">문제 내용이 들어갑니다.</h2>

            <form th:action="@{/certifications/{id}/quiz/submit(id=${certificationId})}" method="post">
                <input type="hidden" name="memberId" th:value="${memberId}">
                <input type="hidden" name="subjectId" th:value="${subjectId}">
                <input type="hidden" name="questionId" th:value="${question.id}">

                <div class="quiz-choice">
                    <label>
                        <input type="radio" name="selectedChoice" value="1" required>
                        <span th:text="'1. ' + ${question.choice1}">1. 선택지1</span>
                    </label>
                </div>
                <div class="quiz-choice">
                    <label>
                        <input type="radio" name="selectedChoice" value="2">
                        <span th:text="'2. ' + ${question.choice2}">2. 선택지2</span>
                    </label>
                </div>
                <div class="quiz-choice">
                    <label>
                        <input type="radio" name="selectedChoice" value="3">
                        <span th:text="'3. ' + ${question.choice3}">3. 선택지3</span>
                    </label>
                </div>
                <div class="quiz-choice">
                    <label>
                        <input type="radio" name="selectedChoice" value="4">
                        <span th:text="'4. ' + ${question.choice4}">4. 선택지4</span>
                    </label>
                </div>

                <div class="form-button-area">
                    <button type="submit" class="submit-button">제출</button>
                </div>
            </form>
        </div>

        <!-- ============ 채점 결과 화면 ============ -->
        <div th:if="${mode == 'result'}">
            <p class="quiz-progress" th:if="${roundNumber != null}">
                <span th:text="${roundNumber} + '회차'">1회차</span>
                ·
                <span th:text="${progressCurrent} + ' / ' + ${progressTotal}">1 / 60</span>
            </p>
            <h2 class="form-title" th:text="${question.questionText}">문제 내용이 들어갑니다.</h2>

            <p th:if="${correct}" class="quiz-result quiz-result--correct">정답입니다! 🎉</p>

            <div th:unless="${correct}">
                <p class="quiz-result quiz-result--wrong">오답입니다.</p>
                <div class="quiz-explanation" th:text="${question.explanation}">해설이 여기 표시됩니다.</div>
            </div>

            <div class="form-button-area" th:unless="${correct}">
                <a th:href="@{/certifications/{id}/quiz(id=${certificationId}, memberId=${memberId}, subjectId=${subjectId})}"
                   class="submit-button" style="text-align:center;">다음 문제</a>
            </div>

            <p th:if="${correct}" class="quiz-auto-next-hint">잠시 후 다음 문제로 넘어갑니다...</p>
        </div>

    </div>
</div>

<!-- 정답이면 짧게 대기 후 자동으로 다음 문제 -->
<script th:if="${mode == 'result' and correct}" th:inline="javascript">
    setTimeout(function () {
        window.location.href = /*[[@{/certifications/{id}/quiz(id=${certificationId}, memberId=${memberId}, subjectId=${subjectId})}]]*/ '#';
    }, 1200);
</script>

</body>
</html>
