<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>아이디 찾기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="/css/main.css">
</head>
<body>

<div class="login-page">
    <div class="login-card">

        <h1 class="login-title">아이디 찾기</h1>
        <p class="login-description">가입한 이메일을 입력하고 인증을 완료하면 아이디를 알려드립니다.</p>

        <div class="login-form">
            <div class="login-input-group">
                <label class="login-label" for="email">이메일</label>
                <input type="email"
                       id="email"
                       class="login-input"
                       placeholder="가입한 이메일을 입력하세요">
            </div>

            <div class="login-input-group">
                <button type="button" class="login-button" onclick="sendCode()">인증번호 발송</button>
            </div>

            <div class="login-input-group">
                <label class="login-label" for="code">인증번호</label>
                <input type="text"
                       id="code"
                       class="login-input"
                       placeholder="6자리 인증번호 입력">
            </div>

            <div class="login-input-group">
                <button type="button" class="login-button" onclick="verifyCode()">인증번호 확인</button>
            </div>
        </div>

        <!-- 찾기 성공 -->
        <div class="find-result-box" id="resultBox" style="display:none;">
            <span class="find-result-label">회원님의 아이디</span>
            <span class="find-result-value" id="resultValue"></span>
        </div>

        <a href="/" class="join-button">로그인으로 돌아가기</a>

    </div>
</div>

<script src="/js/find-id.js"></script>

</body>
</html>
