<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 찾기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="/css/main.css">
</head>
<body>

<div class="login-page">
    <div class="login-card">

        <h1 class="login-title">비밀번호 찾기</h1>
        <p class="login-description">가입한 이메일로 인증번호를 받아 비밀번호를 재설정하세요.</p>

        <form id="resetForm" class="login-form" action="/reset-password" method="post">
            <div class="login-input-group">
                <label class="login-label" for="email">이메일</label>
                <input type="email"
                       id="email"
                       name="email"
                       class="login-input"
                       placeholder="가입한 이메일을 입력하세요"
                       required>
            </div>

            <div class="login-input-group">
                <button type="button" class="login-button" onclick="sendCode()">인증번호 발송</button>
            </div>

            <div class="login-input-group">
                <label class="login-label" for="code">인증번호</label>
                <input type="text"
                       id="code"
                       class="login-input"
                       placeholder="6자리 인증번호 입력">
            </div>

            <div class="login-input-group">
                <button type="button" class="login-button" onclick="verifyCode()">인증번호 확인</button>
            </div>

            <div class="login-input-group">
                <label class="login-label" for="newPassword">새 비밀번호</label>
                <input type="password"
                       id="newPassword"
                       name="newPassword"
                       class="login-input"
                       placeholder="새 비밀번호를 입력하세요"
                       required>
            </div>

            <div class="login-input-group">
                <label class="login-label" for="newPasswordCheck">비밀번호 확인</label>
                <input type="password"
                       id="newPasswordCheck"
                       name="newPasswordCheck"
                       class="login-input"
                       placeholder="비밀번호를 다시 입력하세요"
                       required>
            </div>

            <button type="submit" class="login-button">비밀번호 변경</button>
        </form>

        <!-- 에러 -->
        <p class="error-message" th:if="${error}" th:text="${error}"></p>

        <a href="/" class="join-button">로그인으로 돌아가기</a>

    </div>
</div>

<script src="/js/find-password.js"></script>

</body>
</html>
