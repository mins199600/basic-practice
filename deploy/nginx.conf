# /etc/nginx/conf.d/login-crud.conf 로 복사해서 사용
# 도메인이 있으면 server_name에 도메인을 넣고, 없으면 EC2 퍼블릭 IP로 그대로 접속 가능

server {
    listen 80;
    server_name _;   # 예: mydomain.com

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 설치 방법 (EC2, Amazon Linux 기준):
#   sudo yum install -y nginx
#   sudo cp nginx.conf /etc/nginx/conf.d/login-crud.conf
#   sudo nginx -t                 # 설정 문법 검증
#   sudo systemctl enable nginx
#   sudo systemctl restart nginx
#
# 도메인 연결 후 HTTPS 붙일 때:
#   sudo yum install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d mydomain.com
